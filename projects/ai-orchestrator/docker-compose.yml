services:
  ai-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-orchestrator

    ports:
      - "8000:8000"

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped